services:
  # ── Backend: Node/Express web service ────────────────────────────────────────
  - type: web
    name: leadscrape-api
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # mysql://USER:PASS@HOST:PORT/DBNAME — set in Render dashboard
      - key: JWT_SECRET
        sync: false          # set in Render dashboard
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        sync: false          # set after frontend is deployed
      - key: SCRAPER_TIMEOUT
        value: "15"
      - key: MAX_RETRIES
        value: "2"
      - key: MAX_CRAWL_DEPTH
        value: "3"
      - key: DOMAIN_RATE_LIMIT
        value: "2.0"
      - key: RESPECT_ROBOTS_TXT
        value: "true"
      - key: ENV
        value: production
      - key: NODE_ENV
        value: production

  # ── Frontend: React/Vite static site ─────────────────────────────────────────
  - type: web
    name: leadscrape-frontend
    runtime: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your backend URL in Render dashboard
