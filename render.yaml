services:
  # ── Backend: FastAPI Python web service ──────────────────────────────────────
  - type: web
    name: leadscrape-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard (contains secrets)
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        sync: false          # set after frontend is deployed
      - key: SCRAPER_TIMEOUT
        value: "15"
      - key: MAX_RETRIES
        value: "2"
      - key: MAX_CRAWL_DEPTH
        value: "3"
      - key: DOMAIN_RATE_LIMIT
        value: "2.0"
      - key: RESPECT_ROBOTS_TXT
        value: "true"
      - key: ENV
        value: production

  # ── Frontend: React/Vite static site ─────────────────────────────────────────
  - type: web
    name: leadscrape-frontend
    runtime: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your backend URL in Render dashboard
