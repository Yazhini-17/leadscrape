services:
  # ── Unified LeadScrape Full-Stack Web Service ──────────────────────────────
  - type: web
    name: leadscrape
    runtime: node
    region: singapore
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # mysql://USER:PASS@HOST:PORT/DBNAME — set in Render dashboard
      - key: JWT_SECRET
        sync: false          # set in Render dashboard
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        value: ""            # Same origin now
      - key: SCRAPER_TIMEOUT
        value: "15"
      - key: MAX_RETRIES
        value: "2"
      - key: MAX_CRAWL_DEPTH
        value: "3"
      - key: DOMAIN_RATE_LIMIT
        value: "2.0"
      - key: RESPECT_ROBOTS_TXT
        value: "true"
      - key: ENV
        value: production
      - key: NODE_ENV
        value: production
